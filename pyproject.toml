[project]
name = "sparkinfer"
version = "1.0.1"
description = "DGX Spark and RTX 6000-focused inference kernel library."
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [{ name = "Luke Alonso" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "torch>=2.12.0",
  "cuda-python",
  "nvidia-cutlass-dsl==4.6.0",
  "nvidia-cutlass-dsl-libs-base==4.6.0",
  "nvidia-cutlass-dsl-libs-core==4.6.0",
  "nvidia-cutlass-dsl-libs-cu12==4.6.0",
  "nvidia-cutlass-dsl-libs-cu13==4.6.0",
  "apache-tvm-ffi>=0.1.6,!=0.1.8,!=0.1.8.post0,<0.2",
  "rich>=13",
  "transformers>=4.51",
  "safetensors>=0.6",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "tomli>=2.0; python_version < '3.11'",
]

[build-system]
# torch belongs here. setup.py builds the PCIe comm extensions only if it can
# import torch.utils.cpp_extension and returns {} otherwise, so leaving torch
# out meant the default isolated PEP 517 build ALWAYS produced a pure-Python
# wheel with no extensions -- silently, and indistinguishably from a wheel
# whose extensions had simply never been requested. Every downstream guard
# (--no-build-isolation, the in-wheel .so assertions, the build-info check)
# exists to compensate for that hole; closing it here is the actual fix.
#
# The pin is the ABI the wheel is bound to, not a floor: the extensions link
# against torch's C++ ABI, so a wheel built here only loads against a matching
# torch. sparkinfer/_build_info.json records what was used and _lib/build_info
# checks it before the extension import.
requires = ["setuptools>=77", "packaging>=24", "torch==2.13.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparkinfer*"]

[tool.setuptools.package-data]
"sparkinfer.comm.pcie" = ["*.cu"]
# _build_info.json records the torch/CUDA binding the wheel filename cannot
# express; _aot_cache carries the prebuilt CuTe-DSL kernel objects staged by
# scripts/build_aot_cache.py.  Both are generated, so they are matched by glob
# rather than listed.
"sparkinfer" = ["_build_info.json", "_aot_cache/**/*.o", "_aot_cache/**/*.json"]

[tool.ruff.lint]
select = ["E", "F", "B", "SIM"]
ignore = [
  "E402",
  "E501",
  "E741",
  "SIM102",
  "SIM108",
  "SIM118",
  "B019",
  "B020",
  "B023",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
