name: Build wheels (PCIe comm extensions, AOT)

# Publishes two manylinux_2_28 wheels for sparkinfer -- x86_64 and aarch64 --
# each carrying the four AOT-compiled PCIe comm extensions, plus a PEP 503
# simple index on gh-pages.
#
# Why a wheel exists at all: setup.py builds sparkinfer_pcie_{dma,oneshot,
# twoshot,dcp_a2a}_ext only if it can import torch.utils.cpp_extension, and
# returns {} -- a silent pure-Python install -- when it cannot. torch is now in
# build-system.requires, so an isolated build reaches the real path; the
# isolated-build smoke step below is what keeps that true. The shipped wheels
# are still built with --no-build-isolation, for a different reason: an
# isolated build resolves torch from PyPI, whose default CUDA variant is not
# ours, and these extensions must be linked against the same cu130 torch the
# Sparks run. Isolation controls *whether* extensions get built; the explicit
# install controls *which* torch they are bound to.
#
# Every build asserts its artifacts are actually inside the wheel. Those
# assertions are the point of this workflow; without them a green run means
# nothing.
#
# CUDA 13.0, single variant, no cu128 job. sm_121 (GB10 / DGX Spark) does not
# exist as an nvcc target before CUDA 12.9 -- `nvcc -arch=sm_121` is rejected
# outright by 12.8 -- and CUDA 13.0 still emits sm_86, so one toolkit covers
# both deployed architectures and a second variant would buy nothing.
#
# The same invariant now covers the CuTe-DSL kernels. ~70 DSL modules used to
# JIT at runtime and were not in the wheel at all. CUTLASS 4.6 supports real
# AOT export -- JitCompiledFunction.dump_to_object writes an ELF with the host
# launcher and the cubin, ExternalBinaryModule loads it in a different process
# -- so the compiled objects are now captured on target hardware and shipped
# inside the wheel as sparkinfer/_aot_cache/. See sparkinfer/_lib/aot.py.
#
# The capture cannot happen here: sparkinfer derives each kernel's compile spec
# from live tensors inside run(), so producing the objects needs a GPU of the
# target architecture. The dsl-aot-cache jobs below run on self-hosted runners
# for exactly that, and the wheel jobs consume their artifact. A wheel without
# that artifact still JITs in production, so building one requires setting
# ALLOW_JIT_WHEEL explicitly.
#
# Consequence to keep in mind: these wheels are cp312-only and are bound to the
# torch C++ ABI and CUDA major below, but the filename records neither. setup.py
# now writes sparkinfer/_build_info.json with both, and
# sparkinfer._lib.build_info raises on mismatch when the PCIe extensions load,
# so a mismatched wheel fails at load instead of at an undefined symbol.

on:
  push:
    branches: [appmana/main, build-wheels]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      require_dsl_aot:
        description: >-
          Fail the build if the wheel carries no prebuilt CuTe-DSL kernels.
          Off by default: the AOT cache is a cache, and a wheel without it
          simply compiles each kernel on first use. Turn it on for a release
          where paying that cost on the serving node is not acceptable.
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Matches the serving image: requirements/cuda.txt pins torch==2.13.0 and the
  # Sparks run 2.13.0+cu130 (driver 580.173.02, CUDA 13.0).
  TORCH_VERSION: "2.13.0"
  CUDA_INDEX: "cu130"
  PYTHON_TAG: "cp312"
  # Self-hosted runners that own a GPU of each target architecture. Set as repo
  # variables so the labels are not hardcoded here; an unset label disables that
  # architecture's capture job, which then fails the wheel assertion below
  # rather than silently producing a JIT wheel.
  AOT_RUNNER_X86: ${{ vars.SPARKINFER_AOT_RUNNER_X86 }}
  AOT_RUNNER_AARCH64: ${{ vars.SPARKINFER_AOT_RUNNER_AARCH64 }}
  REQUIRE_DSL_AOT: ${{ inputs.require_dsl_aot && '1' || '0' }}

jobs:
  release-meta:
    name: Compute release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Compute tag and release name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v1.0.1"
          fi
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=sparkinfer ${tag}" >> "$GITHUB_OUTPUT"


  # ------------------------------------------------------- CuTe-DSL AOT cache
  # A cache, not a contract. Everything it carries is a kernel a serving node
  # would otherwise compile inside its first requests; everything it misses
  # still compiles on first use exactly as before. So this job is allowed to be
  # absent, and the wheel jobs below only report its absence.
  #
  # Two GPU architectures, because sparkinfer only ever runs on two:
  # sparkinfer/_lib/gating.py:29-32 accepts compute capability 12.0 and 12.1 and
  # nothing else. sm_86 is not in this matrix -- Ampere is served by flash_mla
  # and the vLLM fork's Triton kernels, and compressed_mla.is_supported() would
  # refuse it anyway, so an sm_86 cubin here would be dead weight.
  #
  # The arch names are the DSL's own resolved forms (sm_120a / sm_121a, per
  # cutlass/base_dsl/runtime/cuda.py:139-145), because that is what a live
  # device resolves to and therefore what the compile cache key must contain.
  #
  # Capture needs a GPU of the target architecture: sparkinfer derives each
  # kernel's compile spec from live tensors inside run(). CUTLASS itself can
  # code-generate for an arch it cannot see, but reaching those compile calls
  # cannot, so these run on self-hosted runners that own the hardware.
  dsl-aot-cache:
    name: Capture CuTe-DSL AOT cache (${{ matrix.arch }})
    if: ${{ vars.SPARKINFER_AOT_RUNNER_SM120 != '' || vars.SPARKINFER_AOT_RUNNER_SM121 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: sm_120a
            runner_var: SPARKINFER_AOT_RUNNER_SM120
            warmup_var: SPARKINFER_AOT_WARMUP_CMD_SM120
          - arch: sm_121a
            runner_var: SPARKINFER_AOT_RUNNER_SM121
            warmup_var: SPARKINFER_AOT_WARMUP_CMD_SM121
    runs-on: ${{ vars[matrix.runner_var] || 'ubuntu-24.04' }}
    steps:
      - name: Skip when no runner owns this architecture
        id: gate
        run: |
          set -euo pipefail
          if [ -z "${{ vars[matrix.runner_var] }}" ]; then
            echo "no ${{ matrix.runner_var }} configured; ${{ matrix.arch }} kernels will JIT on first use"
            echo "have_runner=0" >> "$GITHUB_OUTPUT"
          else
            echo "have_runner=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.have_runner == '1'

      - name: Capture and verify
        if: steps.gate.outputs.have_runner == '1'
        env:
          WARMUP_CMD: ${{ vars[matrix.warmup_var] }}
          PYTHON: ${{ vars.SPARKINFER_AOT_PYTHON || 'python3' }}
        run: |
          set -euo pipefail
          test -n "$WARMUP_CMD" || {
            echo "${{ matrix.warmup_var }} is unset; there is nothing to compile." >&2
            exit 1
          }
          rm -rf build/aot
          "$PYTHON" scripts/build_aot_cache.py capture \
            --stage build/aot --arch "${{ matrix.arch }}" -- \
            bash -lc "$WARMUP_CMD"
          # Strict here, and only here: the capture either exercised the
          # configurations in sparkinfer/_lib/aot_matrix.py or it silently
          # stopped doing so, and shipping the latter as if it were the former
          # is the one thing this job must not do.
          "$PYTHON" scripts/build_aot_cache.py verify --stage build/aot

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.have_runner == '1'
        with:
          name: sparkinfer-aot-cache-${{ matrix.arch }}
          path: build/aot/**
          if-no-files-found: error

  # ---------------------------------------------------------------- x86_64
  manylinux-wheel:
    name: Wheel (manylinux_2_28, x86_64)
    runs-on: ubuntu-24.04
    needs: [release-meta, dsl-aot-cache]
    # dsl-aot-cache is skipped when no self-hosted runner is configured; a
    # skipped dependency must not skip the wheel, it must reach the
    # assertion that decides whether a JIT wheel is allowed.
    if: ${{ !cancelled() }}
    env:
      # The device code in the four .cu files is architecturally plain -- no
      # tcgen05, wgmma, cp.async.bulk, mbarrier or cluster instructions, and
      # the only arch guard is a __CUDA_ARCH__ >= 800 gate on bf16
      # (pcie_oneshot.cu:127). So the arch list is a coverage choice, not a
      # correctness constraint: one fat binary serves the fleet. 8.6 is the
      # Ampere consumer target; 12.0a/12.1a are the archs the library itself
      # declares in sparkinfer/_lib/meta.py:44. There is no PTX entry because
      # nothing here needs forward compatibility to an unlisted arch.
      SPARKINFER_ARCH_LIST: "8.6 12.0a 12.1a"
    steps:
      - name: Free runner disk (the cuda13 manylinux builder is ~20GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Fetch the CuTe-DSL AOT caches captured on target hardware
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          # Both architectures go into both platform wheels. The
          # objects are content-addressed and the arch is part of the
          # key, so they cannot collide and only the matching ones can
          # ever be selected. A fat cache is simpler than a
          # per-platform arch list and the bytes are irrelevant.
          pattern: sparkinfer-aot-cache-*
          merge-multiple: true
          path: build/aot

      - name: Stage the AOT cache into the package tree
        run: |
          set -euo pipefail
          if [ -d build/aot ] && [ -n "$(find build/aot -name '*.o' -print -quit)" ]; then
            python3 scripts/build_aot_cache.py install --stage build/aot
          else
            echo 'no AOT cache artifact; the wheel assertion decides whether that is allowed'
          fi

      - name: Build + repair manylinux_2_28 wheel in the pytorch cuda13 builder
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/io -w /io \
            -e TORCH_CUDA_ARCH_LIST="${SPARKINFER_ARCH_LIST}" \
            pytorch/manylinux2_28-builder:cuda13.0 bash -c '
            set -euo pipefail
            export PATH=/opt/python/'"${PYTHON_TAG}"'-'"${PYTHON_TAG}"'/bin:$PATH
            # CUDAExtension links -lcuda (setup.py:47). Only the driver stub
            # exists in a builder container, and it is not on the default link
            # path.
            export LIBRARY_PATH="/usr/local/cuda/lib64/stubs:${LIBRARY_PATH:-}"
            python -m pip install -q -U pip uv
            uv pip install --system -q "setuptools>=77" "packaging>=24" wheel ninja
            uv pip install --system -q --index-url https://download.pytorch.org/whl/'"${CUDA_INDEX}"' torch=='"${TORCH_VERSION}"'
            rm -rf build dist dist_manylinux
            # No isolation here so the extensions link against the cu130
            # torch installed above rather than whatever variant PyPI would
            # resolve. Isolation itself is proven to work by the separate
            # smoke step below.
            MAX_JOBS=2 NVCC_THREADS=2 python setup.py bdist_wheel
            uv pip install --system -q auditwheel
            auditwheel repair dist/*.whl --plat manylinux_2_28_x86_64 \
              --exclude "libtorch*.so*" --exclude "libc10*.so*" --exclude "libcudart*.so*" \
              --exclude "libcuda.so*" --exclude "libcudnn*.so*" --exclude "libcublas*.so*" \
              --exclude "libnvToolsExt*.so*" \
              -w /io/dist_manylinux/
          '
          sudo chown -R "$(id -u):$(id -g)" dist_manylinux 2>/dev/null || true
          ls -la dist_manylinux/*.whl

      - name: Smoke test the isolated PEP 517 build (guards build-system.requires)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/io -w /io \
            pytorch/manylinux2_28-builder:cuda13.0 bash -c '
            set -euo pipefail
            export PATH=/opt/python/'"${PYTHON_TAG}"'-'"${PYTHON_TAG}"'/bin:$PATH
            export LIBRARY_PATH="/usr/local/cuda/lib64/stubs:${LIBRARY_PATH:-}"
            export TORCH_CUDA_ARCH_LIST="8.6"
            python -m pip install -q -U pip build
            rm -rf build dist_isolated
            # Deliberately isolated and deliberately NOT preinstalling torch:
            # this is the whole test. If torch ever falls out of
            # build-system.requires, setup.py silently emits a pure-Python
            # wheel and this step is the only thing that notices.
            MAX_JOBS=2 NVCC_THREADS=2 python -m build --wheel --outdir dist_isolated
          '
          sudo chown -R "$(id -u):$(id -g)" dist_isolated 2>/dev/null || true
          python3 - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("dist_isolated/*.whl")
          assert len(wheels) == 1, f"expected one wheel, got {wheels}"
          names = zipfile.ZipFile(wheels[0]).namelist()
          missing = [
              w for w in ("dma", "oneshot", "twoshot", "dcp_a2a")
              if not any(n.startswith(f"sparkinfer_pcie_{w}_ext") and n.endswith(".so")
                         for n in names)
          ]
          if missing:
              sys.exit(
                  "an isolated `python -m build` produced a pure-Python wheel: no "
                  f"sparkinfer_pcie_{{{','.join(missing)}}}_ext*.so. torch is missing "
                  "from build-system.requires in pyproject.toml, or setup.py no "
                  "longer reaches its CUDAExtension path."
              )
          print(f"ok: isolated build carries the extensions ({wheels[0]})")
          PY

      - name: Assert the wheel is AOT (extensions, DSL objects, build binding)
        env:
          REQUIRE_DSL_AOT: ${{ env.REQUIRE_DSL_AOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, sys, zipfile
          wheels = glob.glob("dist_manylinux/*.whl")
          assert len(wheels) == 1, f"expected exactly one wheel, got {wheels}"
          zf = zipfile.ZipFile(wheels[0])
          names = zf.namelist()

          # 1. The four PCIe comm extensions.
          want = ["dma", "oneshot", "twoshot", "dcp_a2a"]
          missing = [
              w for w in want
              if not any(n.startswith(f"sparkinfer_pcie_{w}_ext") and n.endswith(".so")
                         for n in names)
          ]
          if missing:
              sys.exit(
                  f"{wheels[0]} is a pure-Python fallback build: no "
                  f"sparkinfer_pcie_{{{','.join(missing)}}}_ext*.so. torch was not "
                  f"importable at build time, or build isolation was in effect."
              )

          # 2. The torch/CUDA binding the filename cannot express. Without this
          #    a wheel built against another torch is indistinguishable.
          info_names = [n for n in names if n.endswith("sparkinfer/_build_info.json")]
          if not info_names:
              sys.exit(f"{wheels[0]} carries no sparkinfer/_build_info.json")
          info = json.loads(zf.read(info_names[0]))
          if not info.get("extensions_built"):
              sys.exit(f"{wheels[0]}: _build_info.json says extensions_built=false")
          for field in ("torch_version", "torch_cuda_version"):
              if not info.get(field):
                  sys.exit(f"{wheels[0]}: _build_info.json has empty {field}")
          if not str(info["torch_cuda_version"]).startswith("13."):
              sys.exit(
                  f"{wheels[0]}: built against CUDA {info['torch_cuda_version']}; "
                  "sm_121 needs CUDA 13 and there is no cu128 variant"
              )

          # 3. The AOT'd CuTe-DSL kernel objects. Unlike 1 and 2 this is NOT a
          #    hard requirement: the cache is a cache, and a wheel without it
          #    compiles each kernel on first use exactly as sparkinfer always
          #    did. Report it loudly, fail only if someone asked.
          dsl = [n for n in names if "/sparkinfer/_aot_cache/" in f"/{n}" and n.endswith(".o")]
          if dsl:
              print(f"ok: {len(dsl)} prebuilt CuTe-DSL kernel object(s)")
          else:
              message = (
                  f"{wheels[0]} carries no sparkinfer/_aot_cache/*.o, so every "
                  "CuTe-DSL kernel will compile on first use. Configure "
                  "SPARKINFER_AOT_RUNNER_SM120 / _SM121 and the matching "
                  "SPARKINFER_AOT_WARMUP_CMD_* to populate it."
              )
              if os.environ.get("REQUIRE_DSL_AOT") == "1":
                  sys.exit(message)
              print(f"NOTE: {message}")

          if "cp312" not in wheels[0] or "manylinux_2_28_x86_64" not in wheels[0]:
              sys.exit(f"unexpected wheel tag: {wheels[0]}")
          print(f"ok: {wheels[0]} torch={info['torch_version']} cuda={info['torch_cuda_version']}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sparkinfer-manylinux_2_28-${{ env.CUDA_INDEX }}
          path: dist_manylinux/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------- aarch64
  # For the DGX Spark (GB10): its Grace CPU is aarch64, so an x86_64 wheel
  # cannot be installed there at all, whatever SASS it carries.
  #
  # The builder image is `manylinuxaarch64-builder` -- the naming differs from
  # the x86_64 job's `manylinux2_28-builder`, and that image is an amd64-only
  # manifest, so it cannot be reused here.
  manylinux-wheel-aarch64:
    name: Wheel (manylinux_2_28, aarch64)
    runs-on: ubuntu-24.04-arm
    needs: [release-meta, dsl-aot-cache]
    if: ${{ !cancelled() }}
    env:
      # sparkinfer's device gate accepts compute capability 12.0 and 12.1 only
      # (sparkinfer/_lib/gating.py:29-32), and no aarch64 NVIDIA part ships
      # sm_86 or sm_120. That leaves exactly GB10.
      SPARKINFER_ARCH_LIST: "12.1a"
    steps:
      - name: Free runner disk (the cuda13 manylinux builder is ~20GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Fetch the CuTe-DSL AOT caches captured on target hardware
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          # Both architectures go into both platform wheels. The
          # objects are content-addressed and the arch is part of the
          # key, so they cannot collide and only the matching ones can
          # ever be selected. A fat cache is simpler than a
          # per-platform arch list and the bytes are irrelevant.
          pattern: sparkinfer-aot-cache-*
          merge-multiple: true
          path: build/aot

      - name: Stage the AOT cache into the package tree
        run: |
          set -euo pipefail
          if [ -d build/aot ] && [ -n "$(find build/aot -name '*.o' -print -quit)" ]; then
            python3 scripts/build_aot_cache.py install --stage build/aot
          else
            echo 'no AOT cache artifact; the wheel assertion decides whether that is allowed'
          fi

      - name: Build + repair manylinux_2_28 aarch64 wheel in the pytorch cuda13 builder
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/io -w /io \
            -e TORCH_CUDA_ARCH_LIST="${SPARKINFER_ARCH_LIST}" \
            pytorch/manylinuxaarch64-builder:cuda13.0 bash -c '
            set -euo pipefail
            export PATH=/opt/python/'"${PYTHON_TAG}"'-'"${PYTHON_TAG}"'/bin:$PATH
            export LIBRARY_PATH="/usr/local/cuda/lib64/stubs:${LIBRARY_PATH:-}"
            python -m pip install -q -U pip uv
            uv pip install --system -q "setuptools>=77" "packaging>=24" wheel ninja
            uv pip install --system -q --index-url https://download.pytorch.org/whl/'"${CUDA_INDEX}"' torch=='"${TORCH_VERSION}"'
            rm -rf build dist dist_manylinux
            # The hosted arm64 runner is 4 cores / 16 GB. Serialize nvcc;
            # wall-clock matters less than finishing.
            MAX_JOBS=1 NVCC_THREADS=1 python setup.py bdist_wheel
            uv pip install --system -q auditwheel
            auditwheel repair dist/*.whl --plat manylinux_2_28_aarch64 \
              --exclude "libtorch*.so*" --exclude "libc10*.so*" --exclude "libcudart*.so*" \
              --exclude "libcuda.so*" --exclude "libcudnn*.so*" --exclude "libcublas*.so*" \
              --exclude "libnvToolsExt*.so*" \
              -w /io/dist_manylinux/
          '
          sudo chown -R "$(id -u):$(id -g)" dist_manylinux 2>/dev/null || true
          ls -la dist_manylinux/*.whl

      - name: Assert the wheel is AOT (extensions, DSL objects, build binding)
        env:
          REQUIRE_DSL_AOT: ${{ env.REQUIRE_DSL_AOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, sys, zipfile
          wheels = glob.glob("dist_manylinux/*.whl")
          assert len(wheels) == 1, f"expected exactly one wheel, got {wheels}"
          zf = zipfile.ZipFile(wheels[0])
          names = zf.namelist()

          # 1. The four PCIe comm extensions.
          want = ["dma", "oneshot", "twoshot", "dcp_a2a"]
          missing = [
              w for w in want
              if not any(n.startswith(f"sparkinfer_pcie_{w}_ext") and n.endswith(".so")
                         for n in names)
          ]
          if missing:
              sys.exit(
                  f"{wheels[0]} is a pure-Python fallback build: no "
                  f"sparkinfer_pcie_{{{','.join(missing)}}}_ext*.so. torch was not "
                  f"importable at build time, or build isolation was in effect."
              )

          # 2. The torch/CUDA binding the filename cannot express. Without this
          #    a wheel built against another torch is indistinguishable.
          info_names = [n for n in names if n.endswith("sparkinfer/_build_info.json")]
          if not info_names:
              sys.exit(f"{wheels[0]} carries no sparkinfer/_build_info.json")
          info = json.loads(zf.read(info_names[0]))
          if not info.get("extensions_built"):
              sys.exit(f"{wheels[0]}: _build_info.json says extensions_built=false")
          for field in ("torch_version", "torch_cuda_version"):
              if not info.get(field):
                  sys.exit(f"{wheels[0]}: _build_info.json has empty {field}")
          if not str(info["torch_cuda_version"]).startswith("13."):
              sys.exit(
                  f"{wheels[0]}: built against CUDA {info['torch_cuda_version']}; "
                  "sm_121 needs CUDA 13 and there is no cu128 variant"
              )

          # 3. The AOT'd CuTe-DSL kernel objects. Unlike 1 and 2 this is NOT a
          #    hard requirement: the cache is a cache, and a wheel without it
          #    compiles each kernel on first use exactly as sparkinfer always
          #    did. Report it loudly, fail only if someone asked.
          dsl = [n for n in names if "/sparkinfer/_aot_cache/" in f"/{n}" and n.endswith(".o")]
          if dsl:
              print(f"ok: {len(dsl)} prebuilt CuTe-DSL kernel object(s)")
          else:
              message = (
                  f"{wheels[0]} carries no sparkinfer/_aot_cache/*.o, so every "
                  "CuTe-DSL kernel will compile on first use. Configure "
                  "SPARKINFER_AOT_RUNNER_SM120 / _SM121 and the matching "
                  "SPARKINFER_AOT_WARMUP_CMD_* to populate it."
              )
              if os.environ.get("REQUIRE_DSL_AOT") == "1":
                  sys.exit(message)
              print(f"NOTE: {message}")

          if "cp312" not in wheels[0] or "manylinux_2_28_aarch64" not in wheels[0]:
              sys.exit(f"unexpected wheel tag: {wheels[0]}")
          print(f"ok: {wheels[0]} torch={info['torch_version']} cuda={info['torch_cuda_version']}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sparkinfer-manylinux_2_28_aarch64-${{ env.CUDA_INDEX }}
          path: dist_manylinux/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------- publish
  publish-release:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [release-meta, manylinux-wheel, manylinux-wheel-aarch64]
    if: ${{ !cancelled() && needs.manylinux-wheel.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: List wheels
        run: ls -la release-artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.release-meta.outputs.release_name }}
          draft: false
          prerelease: false
          files: release-artifacts/*.whl
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- gh-pages simple index
  # Same mechanism as forks-flash-mla-ampere-dsv4: wheels live as GitHub
  # Release assets, and gh-pages carries only a PEP 503 index pointing at them,
  # with links.tsv as the durable manifest so earlier releases survive.
  publish-simple-index:
    name: Publish gh-pages PEP 503 simple index
    runs-on: ubuntu-24.04
    needs: [release-meta, manylinux-wheel, manylinux-wheel-aarch64, publish-release]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare gh-pages branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" gh-pages
          else
            mkdir -p gh-pages && pushd gh-pages >/dev/null
            git init -q && git checkout -q -b gh-pages && git remote add origin "$REPO_URL"
            popd >/dev/null
          fi

      - name: Regenerate simple index (append this release's wheels)
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          pkg_dir="gh-pages/sparkinfer"          # already PEP 503 normalized
          mkdir -p "$pkg_dir"
          manifest="${pkg_dir}/links.tsv"; touch "$manifest"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          urlquote () { python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$1"; }

          shopt -s nullglob
          n=0
          for whl in release-artifacts/*.whl; do
            base="$(basename "$whl")"; hash="$(sha256sum "$whl" | awk '{print $1}')"
            url="${base_url}/$(urlquote "$base")"
            tmp="$(mktemp)"; awk -F '\t' -v n="$base" '$1!=n' "$manifest" > "$tmp"
            printf '%s\t%s\t%s\n' "$base" "$hash" "$url" >> "$tmp"; mv "$tmp" "$manifest"
            n=$((n+1))
          done
          [ "$n" -gt 0 ] || { echo "no wheels to index"; exit 1; }

          # package index page
          { echo '<!doctype html><html><body>'
            sort "$manifest" | while IFS=$'\t' read -r name hash url; do
              [ -n "$name" ] && printf '<a href="%s#sha256=%s">%s</a><br/>\n' "$url" "$hash" "$name"
            done
            echo '</body></html>'; } > "${pkg_dir}/index.html"
          # root index page
          { echo '<!doctype html><html><body><a href="sparkinfer/">sparkinfer</a></body></html>'; } > gh-pages/index.html
          touch gh-pages/.nojekyll

      - name: Commit and push gh-pages
        shell: bash
        run: |
          set -euo pipefail
          pushd gh-pages >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && { echo "no index changes"; exit 0; }
          git commit -q -m "simple index: ${GITHUB_SHA}"
          git push -q origin gh-pages
          popd >/dev/null
