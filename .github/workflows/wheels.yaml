name: Build and publish b12x wheels

on:
  push:
    branches: [appmana/main]
    tags: ["v*", "b12x-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_TAG: "cp312"

jobs:
  release-meta:
    name: Compute release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      package_version: ${{ steps.meta.outputs.package_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Compute tag and release name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            package_version="${tag#b12x-v}"
            package_version="${package_version#v}"
          else
            tag=""
            package_version="1.3.0.dev${GITHUB_RUN_NUMBER}"
          fi
          prerelease=false
          case "$package_version" in
            *dev*|*rc*|*alpha*|*beta*) prerelease=true ;;
          esac
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=b12x ${tag:-artifact}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  wheel-x86_64:
    name: Wheel (manylinux_2_28, x86_64)
    runs-on: ubuntu-24.04
    needs: [release-meta]
    steps:
      - uses: actions/checkout@v4
      - name: Build x86_64 and pure-python wheels
        env:
          PACKAGE_VERSION: ${{ needs.release-meta.outputs.package_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p = Path("pyproject.toml")
          v = os.environ["PACKAGE_VERSION"]
          p.write_text(re.sub(r'^version\s*=\s*"[^"]+"', f'version = "{v}"', p.read_text(), count=1, flags=re.M))
          PY
          python3 -m pip install -q -U pip build wheel
          python3 -m build --wheel --outdir dist
          # Also tag platform-specific wheels for explicit x86_64 index consumers
          for whl in dist/b12x-*-py3-none-any.whl; do
            cp "$whl" "${whl%-py3-none-any.whl}-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: b12x-wheels-x86_64
          path: dist/*.whl
          if-no-files-found: error

  wheel-aarch64:
    name: Wheel (manylinux_2_28, aarch64)
    runs-on: ubuntu-24.04-arm
    needs: [release-meta]
    steps:
      - uses: actions/checkout@v4
      - name: Build aarch64 wheel
        env:
          PACKAGE_VERSION: ${{ needs.release-meta.outputs.package_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p = Path("pyproject.toml")
          v = os.environ["PACKAGE_VERSION"]
          p.write_text(re.sub(r'^version\s*=\s*"[^"]+"', f'version = "{v}"', p.read_text(), count=1, flags=re.M))
          PY
          python3 -m pip install -q -U pip build wheel
          python3 -m build --wheel --outdir dist
          for whl in dist/b12x-*-py3-none-any.whl; do
            mv "$whl" "${whl%-py3-none-any.whl}-cp312-cp312-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: b12x-wheels-aarch64
          path: dist/*.whl
          if-no-files-found: error

  publish-release:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [release-meta, wheel-x86_64, wheel-aarch64]
    if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.wheel-x86_64.result == 'success' && needs.wheel-aarch64.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.release-meta.outputs.release_name }}
          draft: false
          prerelease: ${{ needs.release-meta.outputs.prerelease == 'true' }}
          files: release-artifacts/*.whl
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-simple-index:
    name: Publish gh-pages PEP 503 simple index
    runs-on: ubuntu-24.04
    needs: [release-meta, wheel-x86_64, wheel-aarch64, publish-release]
    if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.publish-release.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Update gh-pages simple index
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch gh-pages "$REPO_URL" gh-pages
          pkg_dir="gh-pages/b12x"
          mkdir -p "$pkg_dir"
          manifest="${pkg_dir}/links.tsv"; touch "$manifest"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          urlquote () { python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$1"; }

          for whl in release-artifacts/*.whl; do
            base="$(basename "$whl")"; hash="$(sha256sum "$whl" | awk '{print $1}')"
            url="${base_url}/$(urlquote "$base")"
            tmp="$(mktemp)"; awk -F '\t' -v n="$base" '$1!=n' "$manifest" > "$tmp"
            printf '%s\t%s\t%s\n' "$base" "$hash" "$url" >> "$tmp"; mv "$tmp" "$manifest"
          done

          { echo '<!doctype html><html><body>'
            sort "$manifest" | while IFS=$'\t' read -r name hash url; do
              [ -n "$name" ] && printf '<a href="%s#sha256=%s">%s</a><br/>\n' "$url" "$hash" "$name"
            done
            echo '</body></html>'; } > "${pkg_dir}/index.html"
          { echo '<!doctype html><html><body><a href="b12x/">b12x</a><br/><a href="sparkinfer/">sparkinfer</a></body></html>'; } > gh-pages/index.html
          touch gh-pages/.nojekyll

          pushd gh-pages >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -q -m "simple index: ${GITHUB_SHA}" && git push -q origin gh-pages)
          popd >/dev/null
